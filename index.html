<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ne Alsam">
<meta name="theme-color" content="#FFFFFF" id="themeColor">
<script>
  try { const t = JSON.parse(localStorage.getItem("na-tema") || '""'); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
<meta name="description" content="Kime, ne için, ne kadar? Sevdiklerine tam onlara göre hediye fikirleri.">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<title>Ne Alsam?</title>
<style>
:root{
  --bg:#FFFFFF; --card:#F4F4F6; --card2:#FFFFFF; --ink:#111113; --sub:#6C6C72; --line:#E9E9EE; --chip:#EDEDF1;
  --acc:#6D28D9; --acc-ink:#FFFFFF; --acc-soft:#F0E8FE; --gold:#C9851F;
  --blue:#2F5BD3; --blue-soft:#E8EEFD; --green:#23834E; --green-soft:#E2F4E9; --amber:#9A6510; --amber-soft:#FBF1DC;
  --shadow:none; --tab:rgba(255,255,255,.86); color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#151517; --card2:#1C1C1F; --ink:#F5F5F7; --sub:#98989F; --line:#26262A; --chip:#202024;
  --acc:#9D6BFF; --acc-ink:#FFFFFF; --acc-soft:#22143D; --gold:#F2B14C;
  --blue:#8AA8FF; --blue-soft:#18203A; --green:#6FD39A; --green-soft:#0F2A1A; --amber:#F0BE62; --amber-soft:#2E2209;
  --shadow:none; --tab:rgba(10,10,12,.82); color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#151517; --card2:#1C1C1F; --ink:#F5F5F7; --sub:#98989F; --line:#26262A; --chip:#202024;
    --acc:#9D6BFF; --acc-ink:#FFFFFF; --acc-soft:#22143D; --gold:#F2B14C;
    --blue:#8AA8FF; --blue-soft:#18203A; --green:#6FD39A; --green-soft:#0F2A1A; --amber:#F0BE62; --amber-soft:#2E2209;
    --shadow:none; --tab:rgba(10,10,12,.82); color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);
  min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:560px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
[hidden]{display:none!important}

/* üst kısım */
.brand{display:flex;align-items:center;gap:9px;padding:6px 0 2px;font-weight:700;font-size:15px}
.brand img{width:28px;height:28px;border-radius:7px}
h1.big{font-size:31px;line-height:1.15;font-weight:800;letter-spacing:-.025em;margin:14px 0 4px}
.lead{color:var(--sub);font-size:15px}
h2.sec{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:26px 0 10px;display:flex;align-items:baseline;justify-content:space-between}
h2.sec button{font-size:14px;font-weight:600;color:var(--acc)}

/* ana sayfa */
.cta{display:flex;align-items:center;gap:14px;width:100%;margin-top:18px;padding:18px;border-radius:18px;background:linear-gradient(135deg,#3B0F87 0%,#6D28D9 55%,#8B5CF6 100%);color:#fff;text-align:left;position:relative;overflow:hidden;box-shadow:0 10px 30px -12px rgba(109,40,217,.6)}
.cta>.ic:first-child{color:#F6C35B}
.cta::after{content:"";position:absolute;right:-40px;top:-50px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(246,195,91,.35),transparent 70%)}
.cta .ic{width:30px;height:30px}
.cta b{display:block;font-size:18px}
.cta span{font-size:14px;opacity:.85}
.cta .go{margin-left:auto;width:20px;height:20px}
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.day{flex:none;width:148px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;text-align:left;box-shadow:var(--shadow)}
.day .d{font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.04em}
.day .n{font-weight:700;font-size:15px;margin:6px 0 10px;line-height:1.25;min-height:38px}
.day .k{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--sub)}
.day .k.hot{background:var(--acc-soft);color:var(--acc)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 4px 10px;font-size:13px;font-weight:600;text-align:center;box-shadow:var(--shadow)}
.tile .av{margin:0 auto 7px}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff;flex:none}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;text-align:left;min-height:56px}
.row+.row{border-top:1px solid var(--line)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{display:block;color:var(--sub);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .chev{color:var(--sub);width:18px;height:18px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600}
.pill.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pill.sm{padding:6px 12px;font-size:13px}
.note-row{display:flex;gap:10px;align-items:center;margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--blue-soft);color:var(--blue);font-size:14px;font-weight:600}
.note-row button{margin-left:auto;color:inherit;opacity:.7}

/* sihirbaz */
.wtop{display:flex;align-items:center;gap:10px;height:44px}
.iconbtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line)}
.bar{flex:1;height:5px;border-radius:5px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:5px;transition:width .3s}
.skip{font-size:15px;font-weight:600;color:var(--sub);padding:8px 4px}
.step{font-size:13px;color:var(--sub);font-weight:600;margin-top:14px}
.q{font-size:27px;line-height:1.2;font-weight:800;letter-spacing:-.02em;margin:4px 0 6px}
.qs{color:var(--sub);font-size:15px;margin-bottom:18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;font-weight:600;font-size:15px;text-align:left;min-height:52px}
.opt.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.opt .ck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center}
.opt.on .ck{background:var(--acc);border-color:var(--acc);color:#fff}
.opt .ck .ic{width:13px;height:13px;stroke-width:3}
.opts.one{grid-template-columns:1fr}
label.f{display:block;font-size:13px;font-weight:600;color:var(--sub);margin:16px 0 6px}
.in{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:13px 14px;font-size:16px;outline:none}
.in:focus{border-color:var(--acc)}
textarea.in{min-height:96px;resize:vertical}
.stepper{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden;width:max-content}
.stepper button{width:52px;height:50px;font-size:22px;font-weight:500}
.stepper input{width:70px;text-align:center;border:0;background:none;font-size:18px;font-weight:700;outline:none;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px}
.seg button{flex:1;padding:10px 6px;border-radius:10px;font-weight:600;font-size:14px;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.grp{font-size:13px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
.addrow{display:flex;gap:8px}
.addrow .in{flex:1}
.addrow button{flex:none;width:50px;border-radius:14px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center}
.switch{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:18px;width:100%;text-align:left}
.switch .t{flex:1}
.switch .t b{display:block;font-size:15px}
.switch .t small{color:var(--sub);font-size:13px}
.tg{width:50px;height:30px;border-radius:15px;background:var(--chip);position:relative;flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.switch.on .tg{background:var(--green)}
.switch.on .tg::after{left:23px}
.sum .row{min-height:48px;padding:11px 14px}
.sum .row small{color:var(--sub);font-size:13px;width:84px;flex:none}
.sum .row span{flex:1;font-weight:600;font-size:14px}
.sum .row em{font-style:normal;color:var(--acc);font-size:14px;font-weight:600}
.dock{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));padding:10px 16px 12px;background:linear-gradient(transparent,var(--bg) 30%);z-index:5}
.dock .in2{max-width:528px;margin:0 auto}
.btn{width:100%;padding:16px;border-radius:14px;background:var(--acc);color:var(--acc-ink);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.45}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.spacer{height:84px}

/* sonuçlar */
.rhead{display:flex;align-items:center;gap:10px;height:44px}
.rhead .t{flex:1;font-weight:700;font-size:16px;text-align:center}
.filt{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 4px;padding:0 16px;scrollbar-width:none}
.filt::-webkit-scrollbar{display:none}
.filt .pill{flex:none}
.sortline{display:flex;align-items:center;justify-content:space-between;color:var(--sub);font-size:13px;margin:10px 2px}
.sortline select{border:0;background:none;color:var(--ink);font-weight:600;font-size:13px}
.item{display:flex;gap:13px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:10px;box-shadow:var(--shadow);position:relative}
.thumb{width:62px;height:62px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none;background:var(--chip)}
.thumb.urun{background:var(--acc-soft)}.thumb.deneyim{background:var(--blue-soft)}.thumb.kendin{background:var(--green-soft)}
.item .t{flex:1;min-width:0;padding-right:26px}
.item b{display:block;font-size:15px;font-weight:700;line-height:1.3}
.item .p{font-weight:700;font-size:14px;margin-top:3px}
.item small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--sub);font-size:13px;margin-top:3px}
.item .fav{position:absolute;top:10px;right:10px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--sub)}
.item .fav.on{color:var(--acc)}
.item .fav.on .ic{fill:currentColor}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:1px}
.rz{position:absolute;left:8px;top:8px;font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;color:#fff;letter-spacing:.02em;z-index:1;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.rz-Trend{background:linear-gradient(135deg,#FF5A3C,#FF2D87)}.rz-Sürpriz{background:linear-gradient(135deg,#7C3AED,#C026D3)}.rz-Tam-isabet{background:linear-gradient(135deg,#0EA5E9,#2563EB)}
.rz-Bütçe-dostu{background:linear-gradient(135deg,#10B981,#059669)}.rz-Deneyim{background:linear-gradient(135deg,#F59E0B,#EA580C)}.rz-El-emeği{background:linear-gradient(135deg,#EC4899,#DB2777)}.rz-Lüks-dokunuş{background:linear-gradient(135deg,#B8860B,#E9B949);color:#1a1200}
.aci{display:inline-flex;align-items:center;gap:6px;margin:10px 0 0;padding:7px 12px;border-radius:999px;background:var(--acc-soft);color:var(--acc);font-size:13px;font-weight:700}
.tag.urun{background:var(--acc-soft);color:var(--acc)}.tag.deneyim{background:var(--blue-soft);color:var(--blue)}.tag.kendin{background:var(--green-soft);color:var(--green)}
.skel{height:90px;border-radius:16px;margin-bottom:10px;background:linear-gradient(90deg,var(--card) 0%,var(--chip) 50%,var(--card) 100%);background-size:200% 100%;animation:sk 1.2s infinite linear;border:1px solid var(--line)}
@keyframes sk{to{background-position:-200% 0}}
.msg{text-align:center;padding:36px 16px;color:var(--sub)}
.msg b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.msg .btn{margin-top:16px;width:auto;display:inline-flex;padding:12px 22px}
.empty{text-align:center;padding:50px 20px;color:var(--sub)}
.empty .ic{width:42px;height:42px;stroke-width:1.4;margin-bottom:10px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.empty .btn{margin-top:18px;width:auto;display:inline-flex;padding:12px 22px}

/* alt menü */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--tab);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:10;padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in2{max-width:560px;margin:0 auto;display:flex}
.tabbar button{flex:1;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--sub);position:relative}
.tabbar button.on{color:var(--acc)}
.tabbar button.on .ic{stroke-width:2.2}
.tabbar .badge{position:absolute;top:9px;left:calc(50% + 6px);background:var(--acc);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* alttan açılan pencere */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s}
.sheet.on{opacity:1;pointer-events:auto}
.sheet .box{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(30px);transition:transform .25s}
.sheet.on .box{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.shead{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.shead h3{flex:1;font-size:20px;font-weight:800;letter-spacing:-.015em;line-height:1.25}
.shead .iconbtn{width:34px;height:34px}
.shead .iconbtn .ic{width:18px;height:18px}
.big-thumb{width:100%;height:120px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:60px;margin-bottom:14px}
.kv{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.kv span{font-size:13px;font-weight:700;padding:5px 10px;border-radius:8px;background:var(--chip)}
.box p.txt{font-size:15px;line-height:1.55;margin-bottom:12px}
.tip{background:var(--amber-soft);color:var(--amber);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5;margin-bottom:16px}
.tip b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.shops{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.shops a{display:flex;align-items:center;gap:8px;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--ink);text-decoration:none}
.shops a i{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:12px;color:#fff;flex:none}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts button{display:flex;align-items:center;justify-content:center;gap:7px;padding:13px 8px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px}
.acts button.on{color:var(--acc);border-color:var(--acc)}
.acts a{display:flex;align-items:center;justify-content:center;gap:7px;padding:13px 8px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--ink);text-decoration:none}
.acts button.on .ic{fill:currentColor}
.acts button.wide{grid-column:span 2}
.cardnote{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;font-size:17px;line-height:1.6;min-height:110px;white-space:pre-wrap;margin:14px 0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:all .2s;pointer-events:none;z-index:70;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{color:var(--sub);font-size:12px;text-align:center;margin-top:28px}
.tile,.day,.cta,.item,.opt,.btn,.pill,.row,.coll,.iconbtn,.acts button,.shops a,.tabbar button,.search{transition:transform .14s ease,background .2s,border-color .2s}
.tile:active,.day:active,.cta:active,.opt:active,.btn:active,.pill:active,.coll:active,.iconbtn:active,.acts button:active,.shops a:active,.search:active{transform:scale(.965)}
.item:active,.row:active{transform:scale(.985)}
.scr{animation:giris .26s cubic-bezier(.2,.8,.2,1)}
@keyframes giris{from{opacity:0;transform:translateY(8px)}}
.top{display:flex;align-items:center;gap:10px;padding:4px 0}
.top .hi{flex:1;min-width:0}
.top .hi small{display:block;color:var(--sub);font-size:14px;font-weight:500}
.top .hi b{display:block;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex:none}
.search{display:flex;align-items:center;gap:10px;width:100%;margin-top:14px;padding:0 14px;height:50px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px}
.search .ic{color:var(--sub);width:20px;height:20px}
.coll{flex:none;width:210px;height:132px;border-radius:18px;padding:14px;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:space-between;scroll-snap-align:start;position:relative;overflow:hidden}
.coll .ic{width:30px;height:30px;stroke-width:1.6;opacity:.95}
.coll b{font-size:16px;line-height:1.2}
.coll small{display:block;font-size:12.5px;opacity:.85;font-weight:500;margin-top:2px}
.coll::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12)}
#splash{position:fixed;inset:0;z-index:60;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .35s}
#splash img{width:150px;height:150px;border-radius:34px;animation:pop .55s cubic-bezier(.2,.9,.3,1.3),parla 1.6s ease-in-out .3s infinite}
#splash b{animation:yazi .5s .25s both}
@keyframes parla{0%,100%{filter:drop-shadow(0 0 0 rgba(139,92,246,0));transform:translateY(0)}50%{filter:drop-shadow(0 0 26px rgba(157,107,255,.75));transform:translateY(-6px)}}

  const l = OZEL.map(([ad, f, kime]) => ({ ad, tarih: sonraki(f), gun: ad, kime }));
  for (const k of kisiler) {
    if (!k.dogum) continue;
    const [yy, mm, dd] = k.dogum.split("-").map(Number);
    const t = sonraki(y => new Date(y, mm - 1, dd));
    l.push({ ad: `${k.ad} doğum günü`, tarih: t, gun: "Doğum günü", kisiId: k.id, yas: yy > 1900 ? t.getFullYear() - yy : 0 });
  }
  return l.sort((a, b) => a.tarih - b.tarih).slice(0, 8);
}
const kalan = n => n === 0 ? "Bugün" : n === 1 ? "Yarın" : `${n} gün kaldı`;
const tarihYaz = d => d.toLocaleDateString("tr-TR", { day: "numeric", month: "long" });

const bosForm = () => ({ fotoOzet: "", serbest: "", kime: "", kisiId: "", isim: "", yas: "", cinsiyet: "", gun: "", butce: null, ilgi: [], tarz: [], turler: [], acil: false, not: "" });
let w = Object.assign(bosForm(), oku("na-form", {}));
let adim = 0;          // 0-6 sorular, 7 sonuçlar
let sonuc = null;       // { istek, fikirler, filtre, sira, durum, hata }
const ADIMLAR = 7;
const formKaydet = () => yaz("na-form", w);

function yeniArama(on = {}) {

function kisidenForm(k, ek = {}) {

  } else if (adim === 4) {

      <button class="switch" style="margin:0 0 12px" data-act="fotoSec"><span style="color:var(--acc)">${ic("camera")}</span><div class="t"><b>Fotoğraftan tahmin et</b><small>${w.fotoOzet ? esc(w.fotoOzet) : "Odası, rafı ya da profilinin ekran görüntüsü"}</small></div>${ic("chev")}</button><input type="file" id="fotoIn" accept="image/*" hidden>
      <div class="addrow"><input class="in" id="fIlgi" maxlength="40" placeholder="Kendin yaz: ör. Harry Potter" enterkeyhint="done"><button data-act="ilgiEkle" aria-label="Ekle">${ic("plus")}</button></div>
      ${w.ilgi.filter(i => !Object.values(ILGI).flat().includes(i)).length ? `<div class="grp">Senin eklediklerin</div><div class="pills">${w.ilgi.filter(i => !Object.values(ILGI).flat().includes(i)).map(i => `<button class="pill sm on" data-act="ilgi" data-v="${esc(i)}">${esc(i)} ✕</button>`).join("")}</div>` : ""}
      ${Object.entries(ILGI).map(([g, l]) => `<div class="grp">${g}</div><div class="pills">${l.map(i => `<button class="pill sm ${w.ilgi.includes(i) ? "on" : ""}" data-act="ilgi" data-v="${esc(i)}">${esc(i)}</button>`).join("")}</div>`).join("")}`;

      <div class="grp">Tarzı</div><div class="pills">${TARZ.map(t => `<button class="pill sm ${w.tarz.includes(t) ? "on" : ""}" data-act="tarz" data-v="${t}">${t}</button>`).join("")}</div>
      <div class="grp">Türü</div><div class="pills">${TUR.map(([t, l]) => `<button class="pill sm ${w.turler.includes(t) ? "on" : ""}" data-act="tur" data-v="${t}">${l}</button>`).join("")}</div>
      <button class="switch ${w.acil ? "on" : ""}" data-act="acil"><div class="t"><b>Acil lazım</b><small>Kargo beklemeden hemen bulunabilecek şeyler</small></div><span class="tg"></span></button>`;

      <textarea class="in" id="fNot" maxlength="180" placeholder="ör. Geçen yıl parfüm aldım. Süs eşyası sevmez, çok pratik biridir.">${esc(w.not)}</textarea>
      <div class="grp">Özet</div>
      <div class="list sum">${sat("Kime", [w.isim, w.kime].filter(Boolean).join(" · ") + (w.yas ? `, ${w.yas} yaş` : ""), 0)}${sat("Ne için", w.gun, 2)}${sat("Bütçe", BUTCE.find(b => b[0] === w.butce)?.[1], 3)}${sat("Sevdikleri", w.ilgi.join(", "), 4)}${sat("Tarz", [...w.tarz, ...w.turler.map(turAd), w.acil ? "Acil" : ""].filter(Boolean).join(", "), 5)}</div>`;
    dugme = "Fikirleri göster";

  v.innerHTML = ust + ic2 + (dugme ? `<div class="spacer"></div><div class="dock"><div class="in2"><button class="btn" data-act="${adim === 6 ? "ara" : "ileri"}">${dugme}</button></div></div>` : "");
  const bagla = (id, alan) => { const e = $(id); if (e) e.oninput = () => { w[alan] = e.value; formKaydet(); }; };

function secenek(etiket, on, alan, deger = etiket) {
  return `<button class="opt ${on ? "on" : ""}" data-act="sec" data-alan="${alan}" data-v="${esc(deger)}">${esc(etiket)}<span class="ck">${on ? ic("check") : ""}</span></button>`;
}
function ilgiEkle() {
  const e = $("#fIlgi"); if (!e) return;
  for (const p of e.value.split(",")) { const m = p.trim(); if (m && w.ilgi.length < 15 && !w.ilgi.some(x => kucuk(x) === kucuk(m))) w.ilgi.push(m); }
  formKaydet(); bulCiz(); setTimeout(() => $("#fIlgi")?.focus(), 0);
}
const toggle = (l, v) => l.includes(v) ? l.filter(x => x !== v) : [...l, v];

/* ---------- sunucuya istek ---------- */
// Yapay zekâ servisleri şimdilik Dolapta Ne Var projesinde çalışıyor (Gemini anahtarı orada).
// Bu projeye kendi GEMINI_API_KEY'i eklenirse API_ADRESI "" yapılabilir.
const API_ADRESI = location.hostname === "localhost" ? "" : "https://dolapta-ne-var-three.vercel.app";
async function api(yol, govde) {
  let r;
  try { r = await fetch(API_ADRESI + yol, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(govde) }); }
  catch { throw new Error("İnternet bağlantını kontrol et."); }
  let j = {}; try { j = await r.json(); } catch {}
  if (!r.ok) { const e = new Error(j.hata || "Şu an cevap alınamadı, birazdan tekrar dene."); e.status = r.status; throw e; }
  return j;
}
function istekYap(f, haric) {
  const kisi = kisiler.find(k => k.id === f.kisiId);
  const ek = [
    f.tarz.length ? `Hediyenin tarzı: ${f.tarz.join(", ")}.` : "",
    f.acil ? "Çok acil: kargo beklemeden, bugün bir mağazadan bulunabilecek şeyler öner." : "",
    f.not.trim()
  ].filter(Boolean).join(" ").slice(0, 300);
  return { kime: f.kime, yas: f.yas, cinsiyet: f.cinsiyet, gun: f.gun, butce: f.butce || "", ilgi: f.ilgi, turler: f.turler, notlar: ek,
    haric: [...new Set([...haric, ...(kisi?.alinan || []).map(a => a.ad), ...oku("na-gorulen", [])])].slice(0, 40) };
}
async function ara(dahaFazla) {
  if (!dahaFazla) {
    sonuc = { istek: JSON.parse(JSON.stringify(w)), fikirler: [], filtre: "", sira: "", durum: "yukleniyor" };
    const iz = { kime: w.kime, isim: w.isim, gun: w.gun, butce: w.butce, ilgi: w.ilgi.slice(0, 4), form: sonuc.istek };
    gecmis = [iz, ...gecmis.filter(g => JSON.stringify(g.form) !== JSON.stringify(iz.form))].slice(0, 5); kaydet();
    adim = ADIMLAR;
  } else sonuc.durum = "dahayukleniyor";
  sonucCiz();
  const benim = sonuc;
  try {
    const j = await api("/api/hediye", istekYap(sonuc.istek, sonuc.fikirler.map(f => f.ad)));
    if (benim !== sonuc) return;
    const yeni = (j.fikirler || []).filter(f => !sonuc.fikirler.some(x => kucuk(x.ad) === kucuk(f.ad)));
    if (!yeni.length && !dahaFazla) throw new Error("Bu sefer fikir çıkmadı, bir daha dene.");
    sonuc.fikirler.push(...yeni); sonuc.durum = "tamam"; sonuc.hata = ""; if (j.aci) sonuc.aci = j.aci; gorulduEkle(yeni);
  } catch (e) {
    if (benim !== sonuc) return;
    sonuc.durum = dahaFazla ? "tamam" : "hata"; sonuc.hata = e.message;
    if (dahaFazla) toast(e.message);
  }
  if (sekme === "bul") sonucCiz();
}

function serbestAra(q) {
  w = Object.assign(bosForm(), { kime: "Tarif edilen kişi", serbest: q.slice(0, 140), not: `Aradığım kişi ve durum: ${q.slice(0, 140)}` });
  formKaydet(); git("bul"); ara(false);
}

const gorulduEkle = l => yaz("na-gorulen", [...l.map(f => f.ad), ...oku("na-gorulen", [])].filter((x, i, a) => a.indexOf(x) === i).slice(0, 40));

/* ---------- sonuçlar ---------- */
const fiyatSayi = s => { const m = String(s || "").replace(/\./g, "").match(/\d+/); return m ? +m[0] : Infinity; };
const favMi = f => favs.some(x => kucuk(x.ad) === kucuk(f.ad));
const etiketYap = i => i.serbest ? `"${i.serbest.length > 28 ? i.serbest.slice(0, 28) + "…" : i.serbest}"` : [i.isim || i.kime, i.gun].filter(Boolean).join(" · ");
function sonucCiz() {
  const s = sonuc, v = $("#v-bul");
  const ust = `<div class="rhead"><button class="iconbtn" ${s.istek.serbest ? 'data-act="sekme" data-v="home"' : 'data-act="adim" data-v="6"'} aria-label="Geri">${ic("back")}</button><div class="t">${s.istek.serbest ? "Sonuçlar" : esc(s.istek.isim || s.istek.kime) + " için"}</div><button class="iconbtn" data-act="listePaylas" aria-label="Paylaş">${ic("share")}</button></div>`;
  if (s.durum === "yukleniyor") { v.innerHTML = ust + `<p class="lead" style="margin:14px 2px">Fikirler hazırlanıyor…</p>` + '<div class="skel"></div>'.repeat(5); return; }
  if (s.durum === "hata") { v.innerHTML = ust + `<div class="msg"><b>Bu sefer olmadı</b>${esc(s.hata)}<br><small style="display:block;margin-top:8px;font-size:13px">Yapay zekâ bazen kısa süreliğine yoğun oluyor; birkaç saniye sonra tekrar dene.</small><button class="btn" data-act="ara">${ic("refresh")}Tekrar dene</button></div>`; return; }
  let l = s.fikirler.map((f, i) => ({ f, i }));
  if (s.filtre) l = l.filter(x => x.f.tur === s.filtre);
  if (s.sira === "artan") l.sort((a, b) => fiyatSayi(a.f.fiyat) - fiyatSayi(b.f.fiyat));
  if (s.sira === "azalan") l.sort((a, b) => fiyatSayi(b.f.fiyat) - fiyatSayi(a.f.fiyat));
  const say = t => s.fikirler.filter(f => !t || f.tur === t).length;

function uzmanlar(f) {
  const metin = " " + kucuk(`${f.ad} ${f.arama || ""}`).replace(/[^\p{L}\p{N}]+/gu, " ") + " ";
  const q = encodeURIComponent(f.arama || f.ad), sonuc = [], basliklar = [];
  for (const g of UZMAN) {
    if (!g.k.some(k => metin.includes(" " + k))) continue;
    basliklar.push(g.ad);
    for (const m of g.m) if (!sonuc.some(x => x.id === m)) { const s = MAGAZA[m]; sonuc.push({ id: m, ad: s.ad, h: s.h, r: s.r, url: s.ara ? s.ara(q) : s.ana, ana: !s.ara }); }
    if (sonuc.length >= 4) break;
  }
  return { baslik: basliklar[0] || "", l: sonuc.slice(0, 4) };
}

async function paylas(metin) {

/* ---------- link içine veri gömme (sunucusuz paylaşım) ---------- */
const b64e = o => { const b = new TextEncoder().encode(JSON.stringify(o)); let s = ""; b.forEach(x => s += String.fromCharCode(x)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
const b64d = s => { const t = atob(s.replace(/-/g, "+").replace(/_/g, "/")); return JSON.parse(new TextDecoder().decode(Uint8Array.from(t, c => c.charCodeAt(0)))); };
function tamAc(id, html) { document.getElementById(id)?.remove(); const d = document.createElement("div"); d.className = "tam"; d.id = id; d.innerHTML = `<div class="in3">${html}</div>`; document.body.appendChild(d); return d; }

function icsIndir(liste) {

  const url = "/api/takvim?v=" + b64e(l.map(k => ({ i: k.id, a: k.ad, d: k.dogum }))) + "&o=" + encodeURIComponent(location.origin);
  if (location.hostname === "localhost" || /iphone|ipad|ipod|macintosh/i.test(navigator.userAgent)) { location.href = url; return; }
  const a = document.createElement("a"); a.href = url; a.download = "dogum-gunleri.ics"; document.body.appendChild(a); a.click(); a.remove();
  toast("Dosya indi, açınca takvime eklenir");

      const goster = pk.acik ? pk.fikirler : pk.fikirler.slice(0, 1);
      return bas + goster.map(f => { planDuz.push(f); return urunKarti(f, planDuz.length - 1, "p"); }).join("") +
        (pk.fikirler.length > 1 ? `<button class="inline" data-act="planAc2" data-i="${i}">${pk.acik ? "Daha az göster" : `Diğer ${pk.fikirler.length - 1} fikir`}</button>` : "");

const ANKET_TIP = [
  ["Maceracı ruh", ["Kamp", "Doğa yürüyüşü", "Seyahat", "Yüzme", "Fitness", "Koşu"]],
  ["Keyif ustası", ["Film ve dizi", "Kahve", "Çay", "Dekorasyon", "Rahatlatıcı"]],

function anketSonuc(c) {
  const ilgi = [], tarz = [], turler = [];
  c.forEach((s, n) => { const o = ANKET[n]?.o[s]; if (!o) return; (o[1] || []).forEach(x => ilgi.includes(x) || ilgi.push(x)); (o[2] || []).forEach(x => tarz.includes(x) || tarz.push(x)); (o[3] || []).forEach(x => turler.includes(x) || turler.push(x)); });
  const puan = ANKET_TIP.map(([ad, l]) => [ad, [...ilgi, ...tarz].filter(x => l.includes(x)).length]).sort((a, b) => b[1] - a[1]);
  return { ilgi, tarz, turler, tip: puan[0][1] ? puan[0][0] : "Gizemli ve özgün" };
}

function linkKontrol() {
  const m = location.hash.match(/^#(liste|anket|cevap)=([A-Za-z0-9_-]+)$/); if (!m) return false;
  try {
    const v = b64d(m[2]);
    if (m[1] === "liste" && Array.isArray(v.i)) listeGoster({ a: String(v.a || "").slice(0, 24), i: v.i.slice(0, 25).map(x => [0, 1, 2, 3, 4].map(n => String(x?.[n] ?? "").slice(0, 400))) });
    else if (m[1] === "anket") anketCoz({ id: String(v.id || ""), k: String(v.k || "").slice(0, 24), g: String(v.g || "").slice(0, 24) });
    else if (m[1] === "cevap" && Array.isArray(v.c)) { history.replaceState(null, "", location.pathname); cevapAl({ id: String(v.id || ""), k: String(v.k || "").slice(0, 24), c: v.c.slice(0, ANKET.length).map(Number) }); }

}
