<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ne Alsam">
<meta name="theme-color" content="#FFFFFF" id="themeColor">
<script>
  try { const t = JSON.parse(localStorage.getItem("na-tema") || '""'); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
<meta name="description" content="Kime, ne için, ne kadar? Sevdiklerine tam onlara göre hediye fikirleri.">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<title>Ne Alsam?</title>
<style>
:root{
  --bg:#FFFFFF; --card:#F4F4F6; --card2:#FFFFFF; --ink:#111113; --sub:#6C6C72; --line:#E9E9EE; --chip:#EDEDF1;
  --acc:#6D28D9; --acc-ink:#FFFFFF; --acc-soft:#F0E8FE; --gold:#C9851F;
  --blue:#2F5BD3; --blue-soft:#E8EEFD; --green:#23834E; --green-soft:#E2F4E9; --amber:#9A6510; --amber-soft:#FBF1DC;
  --shadow:none; --tab:rgba(255,255,255,.86); color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#151517; --card2:#1C1C1F; --ink:#F5F5F7; --sub:#98989F; --line:#26262A; --chip:#202024;
  --acc:#9D6BFF; --acc-ink:#FFFFFF; --acc-soft:#22143D; --gold:#F2B14C;
  --blue:#8AA8FF; --blue-soft:#18203A; --green:#6FD39A; --green-soft:#0F2A1A; --amber:#F0BE62; --amber-soft:#2E2209;
  --shadow:none; --tab:rgba(10,10,12,.82); color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#151517; --card2:#1C1C1F; --ink:#F5F5F7; --sub:#98989F; --line:#26262A; --chip:#202024;
    --acc:#9D6BFF; --acc-ink:#FFFFFF; --acc-soft:#22143D; --gold:#F2B14C;
    --blue:#8AA8FF; --blue-soft:#18203A; --green:#6FD39A; --green-soft:#0F2A1A; --amber:#F0BE62; --amber-soft:#2E2209;
    --shadow:none; --tab:rgba(10,10,12,.82); color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);
  min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:560px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
[hidden]{display:none!important}

/* üst kısım */
.brand{display:flex;align-items:center;gap:9px;padding:6px 0 2px;font-weight:700;font-size:15px}
.brand img{width:28px;height:28px;border-radius:7px}
h1.big{font-size:31px;line-height:1.15;font-weight:800;letter-spacing:-.025em;margin:14px 0 4px}
.lead{color:var(--sub);font-size:15px}
h2.sec{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:26px 0 10px;display:flex;align-items:baseline;justify-content:space-between}
h2.sec button{font-size:14px;font-weight:600;color:var(--acc)}

/* ana sayfa */
.cta{display:flex;align-items:center;gap:14px;width:100%;margin-top:18px;padding:18px;border-radius:18px;background:linear-gradient(135deg,#3B0F87 0%,#6D28D9 55%,#8B5CF6 100%);color:#fff;text-align:left;position:relative;overflow:hidden;box-shadow:0 10px 30px -12px rgba(109,40,217,.6)}
.cta>.ic:first-child{color:#F6C35B}
.cta::after{content:"";position:absolute;right:-40px;top:-50px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(246,195,91,.35),transparent 70%)}
.cta .ic{width:30px;height:30px}
.cta b{display:block;font-size:18px}
.cta span{font-size:14px;opacity:.85}
.cta .go{margin-left:auto;width:20px;height:20px}
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.day{flex:none;width:148px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;text-align:left;box-shadow:var(--shadow)}
.day .d{font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.04em}
.day .n{font-weight:700;font-size:15px;margin:6px 0 10px;line-height:1.25;min-height:38px}
.day .k{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--sub)}
.day .k.hot{background:var(--acc-soft);color:var(--acc)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 4px 10px;font-size:13px;font-weight:600;text-align:center;box-shadow:var(--shadow)}
.tile .av{margin:0 auto 7px}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff;flex:none}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;text-align:left;min-height:56px}
.row+.row{border-top:1px solid var(--line)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{display:block;color:var(--sub);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .chev{color:var(--sub);width:18px;height:18px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600}
.pill.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pill.sm{padding:6px 12px;font-size:13px}
.note-row{display:flex;gap:10px;align-items:center;margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--blue-soft);color:var(--blue);font-size:14px;font-weight:600}
.note-row button{margin-left:auto;color:inherit;opacity:.7}

/* sihirbaz */
.wtop{display:flex;align-items:center;gap:10px;height:44px}
.iconbtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line)}
.bar{flex:1;height:5px;border-radius:5px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:5px;transition:width .3s}
.skip{font-size:15px;font-weight:600;color:var(--sub);padding:8px 4px}
.step{font-size:13px;color:var(--sub);font-weight:600;margin-top:14px}
.q{font-size:27px;line-height:1.2;font-weight:800;letter-spacing:-.02em;margin:4px 0 6px}
.qs{color:var(--sub);font-size:15px;margin-bottom:18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;font-weight:600;font-size:15px;text-align:left;min-height:52px}
.opt.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.opt .ck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center}
.opt.on .ck{background:var(--acc);border-color:var(--acc);color:#fff}
.opt .ck .ic{width:13px;height:13px;stroke-width:3}
.opts.one{grid-template-columns:1fr}
label.f{display:block;font-size:13px;font-weight:600;color:var(--sub);margin:16px 0 6px}
.in{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:13px 14px;font-size:16px;outline:none}
.in:focus{border-color:var(--acc)}
textarea.in{min-height:96px;resize:vertical}
.stepper{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden;width:max-content}
.stepper button{width:52px;height:50px;font-size:22px;font-weight:500}
.stepper input{width:70px;text-align:center;border:0;background:none;font-size:18px;font-weight:700;outline:none;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px}
.seg button{flex:1;padding:10px 6px;border-radius:10px;font-weight:600;font-size:14px;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.grp{font-size:13px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
.addrow{display:flex;gap:8px}
.addrow .in{flex:1}
.addrow button{flex:none;width:50px;border-radius:14px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center}
.switch{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:18px;width:100%;text-align:left}
.switch .t{flex:1}
.switch .t b{display:block;font-size:15px}
.switch .t small{color:var(--sub);font-size:13px}
.tg{width:50px;height:30px;border-radius:15px;background:var(--chip);position:relative;flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.switch.on .tg{background:var(--green)}
.switch.on .tg::after{left:23px}
.sum .row{min-height:48px;padding:11px 14px}
.sum .row small{color:var(--sub);font-size:13px;width:84px;flex:none}
.sum .row span{flex:1;font-weight:600;font-size:14px}
.sum .row em{font-style:normal;color:var(--acc);font-size:14px;font-weight:600}
.dock{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));padding:10px 16px 12px;background:linear-gradient(transparent,var(--bg) 30%);z-index:5}
.dock .in2{max-width:528px;margin:0 auto}
.btn{width:100%;padding:16px;border-radius:14px;background:var(--acc);color:var(--acc-ink);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.45}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.spacer{height:84px}

/* sonuçlar */
.rhead{display:flex;align-items:center;gap:10px;height:44px}
.rhead .t{flex:1;font-weight:700;font-size:16px;text-align:center}
.filt{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 4px;padding:0 16px;scrollbar-width:none}
.filt::-webkit-scrollbar{display:none}
.filt .pill{flex:none}
.sortline{display:flex;align-items:center;justify-content:space-between;color:var(--sub);font-size:13px;margin:10px 2px}
.sortline select{border:0;background:none;color:var(--ink);font-weight:600;font-size:13px}
.item{display:flex;gap:13px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:10px;box-shadow:var(--shadow);position:relative}
.thumb{width:62px;height:62px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none;background:var(--chip)}
.thumb.urun{background:var(--acc-soft)}.thumb.deneyim{background:var(--blue-soft)}.thumb.kendin{background:var(--green-soft)}
.item .t{flex:1;min-width:0;padding-right:26px}
.item b{display:block;font-size:15px;font-weight:700;line-height:1.3}
.item .p{font-weight:700;font-size:14px;margin-top:3px}
.item small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--sub);font-size:13px;margin-top:3px}
.item .fav{position:absolute;top:10px;right:10px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--sub)}
.item .fav.on{color:var(--acc)}
.item .fav.on .ic{fill:currentColor}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:1px}
.tag.urun{background:var(--acc-soft);color:var(--acc)}.tag.deneyim{background:var(--blue-soft);color:var(--blue)}.tag.kendin{background:var(--green-soft);color:var(--green)}
.skel{height:90px;border-radius:16px;margin-bottom:10px;background:linear-gradient(90deg,var(--card) 0%,var(--chip) 50%,var(--card) 100%);background-size:200% 100%;animation:sk 1.2s infinite linear;border:1px solid var(--line)}
@keyframes sk{to{background-position:-200% 0}}
.msg{text-align:center;padding:36px 16px;color:var(--sub)}
.msg b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.msg .btn{margin-top:16px;width:auto;display:inline-flex;padding:12px 22px}
.empty{text-align:center;padding:50px 20px;color:var(--sub)}
.empty .ic{width:42px;height:42px;stroke-width:1.4;margin-bottom:10px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.empty .btn{margin-top:18px;width:auto;display:inline-flex;padding:12px 22px}

/* alt menü */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--tab);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:10;padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in2{max-width:560px;margin:0 auto;display:flex}
.tabbar button{flex:1;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--sub);position:relative}
.tabbar button.on{color:var(--acc)}
.tabbar button.on .ic{stroke-width:2.2}
.tabbar .badge{position:absolute;top:9px;left:calc(50% + 6px);background:var(--acc);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* alttan açılan pencere */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s}
.sheet.on{opacity:1;pointer-events:auto}
.sheet .box{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(30px);transition:transform .25s}
.sheet.on .box{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.shead{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.shead h3{flex:1;font-size:20px;font-weight:800;letter-spacing:-.015em;line-height:1.25}
.shead .iconbtn{width:34px;height:34px}
.shead .iconbtn .ic{width:18px;height:18px}
.big-thumb{width:100%;height:120px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:60px;margin-bottom:14px}
.kv{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.kv span{font-size:13px;font-weight:700;padding:5px 10px;border-radius:8px;background:var(--chip)}
.box p.txt{font-size:15px;line-height:1.55;margin-bottom:12px}
.tip{background:var(--amber-soft);color:var(--amber);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5;margin-bottom:16px}
.tip b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.shops{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.shops a{display:flex;align-items:center;gap:8px;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--ink);text-decoration:none}
.shops a i{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:12px;color:#fff;flex:none}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts button{display:flex;align-items:center;justify-content:center;gap:7px;padding:13px 8px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px}
.acts button.on{color:var(--acc);border-color:var(--acc)}
.acts button.on .ic{fill:currentColor}
.acts button.wide{grid-column:span 2}
.cardnote{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;font-size:17px;line-height:1.6;min-height:110px;white-space:pre-wrap;margin:14px 0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:all .2s;pointer-events:none;z-index:40;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{color:var(--sub);font-size:12px;text-align:center;margin-top:28px}
.tile,.day,.cta,.item,.opt,.btn,.pill,.row,.coll,.iconbtn,.acts button,.shops a,.tabbar button,.search{transition:transform .14s ease,background .2s,border-color .2s}
.tile:active,.day:active,.cta:active,.opt:active,.btn:active,.pill:active,.coll:active,.iconbtn:active,.acts button:active,.shops a:active,.search:active{transform:scale(.965)}
.item:active,.row:active{transform:scale(.985)}
.scr{animation:giris .26s cubic-bezier(.2,.8,.2,1)}
@keyframes giris{from{opacity:0;transform:translateY(8px)}}
.top{display:flex;align-items:center;gap:10px;padding:4px 0}
.top .hi{flex:1;min-width:0}
.top .hi small{display:block;color:var(--sub);font-size:14px;font-weight:500}
.top .hi b{display:block;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex:none}
.search{display:flex;align-items:center;gap:10px;width:100%;margin-top:14px;padding:0 14px;height:50px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px}
.search .ic{color:var(--sub);width:20px;height:20px}
.coll{flex:none;width:210px;height:132px;border-radius:18px;padding:14px;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:space-between;scroll-snap-align:start;position:relative;overflow:hidden}
.coll .ic{width:30px;height:30px;stroke-width:1.6;opacity:.95}
.coll b{font-size:16px;line-height:1.2}
.coll small{display:block;font-size:12.5px;opacity:.85;font-weight:500;margin-top:2px}
.coll::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12)}
#splash{position:fixed;inset:0;z-index:60;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .35s}
#splash img{width:150px;height:150px;border-radius:34px;animation:pop .55s cubic-bezier(.2,.9,.3,1.3),parla 1.6s ease-in-out .3s infinite}
#splash b{animation:yazi .5s .25s both}
@keyframes parla{0%,100%{filter:drop-shadow(0 0 0 rgba(139,92,246,0));transform:translateY(0)}50%{filter:drop-shadow(0 0 26px rgba(157,107,255,.75));transform:translateY(-6px)}}
@keyframes yazi{from{opacity:0;transform:translateY(8px)}}
#splash b{font-size:22px;font-weight:800;letter-spacing:-.02em}
#splash.bitti{opacity:0;pointer-events:none}
@keyframes pop{from{transform:scale(.7);opacity:0}}
#tanit{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))}
#tanit .sl{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:460px;margin:0 auto;width:100%}
#tanit img{width:120px;height:120px;border-radius:28px;margin-bottom:24px;animation:suz 3s ease-in-out infinite}
@keyframes suz{0%,100%{transform:translateY(0);box-shadow:0 12px 30px -10px rgba(109,40,217,.45)}50%{transform:translateY(-8px);box-shadow:0 22px 40px -12px rgba(109,40,217,.6)}}
#tanit h2{font-size:32px;line-height:1.12;font-weight:800;letter-spacing:-.03em;margin-bottom:10px}
#tanit p{color:var(--sub);font-size:17px;line-height:1.45}
#tanit .feat{display:flex;gap:14px;align-items:flex-start;margin-top:20px}

</style>

<body>
<div id="splash"><img src="/icon-512.png" alt=""><b>Ne Alsam?</b></div>
<div class="app">
  <section id="v-home"></section>
  <section id="v-bul" hidden></section>
  <section id="v-kisi" hidden></section>
  <section id="v-kayit" hidden></section>
</div>

<nav class="tabbar"><div class="in2" id="tabs"></div></nav>
<div class="sheet" id="sheet"><div class="box" id="sbox"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- yardımcılar ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const oku = (k, v) => { try { const x = localStorage.getItem(k); return x ? JSON.parse(x) : v; } catch { return v; } };
const yaz = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const toast = m => { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._z); t._z = setTimeout(() => t.classList.remove("on"), 1900); };
const kucuk = s => String(s).toLocaleLowerCase("tr");
const yeniId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const YOL = {
  home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  gift: '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8M12 8v13M12 8S10.5 3 7.5 3a2.5 2.5 0 0 0 0 5M12 8s1.5-5 4.5-5a2.5 2.5 0 0 1 0 5"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.7.7 3 2.4 3.5 5.2"/>',
  heart: '<path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/>',
  back: '<path d="M15 5l-7 7 7 7"/>', close: '<path d="M6 6l12 12M18 6 6 18"/>', plus: '<path d="M12 5v14M5 12h14"/>',
  chev: '<path d="M9 5l7 7-7 7"/>', arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>', check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  share: '<path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>',
  pen: '<path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/>', cal: '<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>', refresh: '<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>',
  phone: '<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/>', bag: '<path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"/>',
  clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>',
  cup: '<path d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM16 10h1.5a2.5 2.5 0 0 1 0 5H16M8 3c-.7 1 .7 2 0 3M12 3c-.7 1 .7 2 0 3"/>',
  pad: '<rect x="2.5" y="7" width="19" height="11" rx="5.5"/><path d="M7 11v3M5.5 12.5h3M15.5 11.5h.01M17.5 13.5h.01"/>',
  book: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5zM4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/>',
  tent: '<path d="M12 4 3 20h18zM12 4v16M9 20l3-6 3 6"/>',
  spark: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
  ticket: '<path d="M3 8a2 2 0 0 0 2-2h14a2 2 0 0 0 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 0-2 2H5a2 2 0 0 0-2-2v-2a2 2 0 0 0 0-4zM14 6v12"/>',
  tag: '<path d="M3 12V4h8l10 10-8 8zM7.5 7.5h.01"/>',
  leaf: '<path d="M5 19c0-9 6-14 15-14 0 9-5 15-14 15M5 19l7-7"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>'
};
const ic = n => `<svg class="ic" viewBox="0 0 24 24">${YOL[n]}</svg>`;

/* ---------- sabit listeler ---------- */
const KIME = ["Anne","Baba","Sevgili","Eş","Arkadaş","Kardeş","Çocuk","Bebek","Dede","Nine","Teyze / Hala","Amca / Dayı","Kuzen","İş arkadaşı","Patron","Öğretmen","Komşu","Kendim"];
const GUN = ["Doğum günü","Yılbaşı","Sevgililer Günü","Anneler Günü","Babalar Günü","Öğretmenler Günü","Kadınlar Günü","Yıldönümü","Nişan / Düğün","Mezuniyet","Karne","Yeni ev","Yeni iş","Emeklilik","Bebek doğumu","Geçmiş olsun","Teşekkür","Özür dilemek","Bayram","Sebepsiz"];
const BUTCE = [["300","300 ₺'ye kadar"],["750","300 – 750 ₺"],["1500","750 – 1.500 ₺"],["3000","1.500 – 3.000 ₺"],["7500","3.000 – 7.500 ₺"],["7500+","7.500 ₺ ve üstü"],["","Fark etmez"]];
const ILGI = {
  "Hobiler": ["Kitap","Resim","Müzik","Fotoğraf","El işi","Bahçe","Bitkiler","Yemek yapmak","Kahve","Çay","Koleksiyon"],
  "Spor ve doğa": ["Futbol","Basketbol","Koşu","Fitness","Yoga","Bisiklet","Kamp","Balık tutmak","Yüzme","Doğa yürüyüşü"],
  "Eğlence": ["Film ve dizi","Anime","Video oyunları","Kutu oyunları","Konser","Tiyatro","Podcast"],
  "Yaşam": ["Moda","Makyaj","Cilt bakımı","Parfüm","Dekorasyon","Seyahat","Hayvanlar","Teknoloji","Araba","Astroloji"]
};
const TARZ = ["Pratik","Romantik","Eğlenceli","Şık","Kişiye özel","Doğa dostu","Teknolojik","Nostaljik","Rahatlatıcı"];
const TUR = [["ürün","Ürün"],["deneyim","Deneyim"],["kendin yap","Kendin yap"]];
const KOLEKSIYON = [
  { ad: "Kahve tutkunlarına", alt: "Demlemeden fincana", ic: "cup", r: ["#6B4226","#B07A4F"], f: { ilgi: ["Kahve"] } },
  { ad: "Son dakika", alt: "Bugün bulunabilecekler", ic: "clock", r: ["#C0392B","#E8735A"], f: { acil: true } },
  { ad: "Oyunculara", alt: "Konsol, PC, kutu oyunu", ic: "pad", r: ["#4B2BB3","#8A63F2"], f: { ilgi: ["Video oyunları","Kutu oyunları"] } },
  { ad: "Kitap kurtlarına", alt: "Sayfalar arasında", ic: "book", r: ["#1F5E4A","#3E9A78"], f: { ilgi: ["Kitap"] } },
  { ad: "300 ₺ altı", alt: "Az bütçe, çok anlam", ic: "tag", r: ["#1E4FB8","#4D86F0"], f: { butce: "300" } },
  { ad: "Deneyim hediyeleri", alt: "Eşya değil, anı", ic: "ticket", r: ["#A2306B","#E25C9E"], f: { turler: ["deneyim"] } },
  { ad: "Doğa ve kamp", alt: "Dışarıyı sevenlere", ic: "tent", r: ["#3C5A1E","#7A9E3C"], f: { ilgi: ["Kamp","Doğa yürüyüşü"] } },
  { ad: "Kendine iyi bak", alt: "Bakım ve rahatlama", ic: "leaf", r: ["#2D6E7E","#56AFC2"], f: { ilgi: ["Cilt bakımı"], tarz: ["Rahatlatıcı"] } }
];
const TON = [["duygusal","Duygusal"],["komik","Komik"],["kısa","Kısa"],["şiirsel","Şiirsel"]];
const RENK = ["#C8324B","#2F5BD3","#2F7D4F","#9A6510","#7A3FC2","#0F7C8C","#C2571A","#5A5F6B"];
const renk = s => RENK[[...String(s)].reduce((a, c) => a + c.charCodeAt(0), 0) % RENK.length];
const harf = s => (String(s).trim()[0] || "?").toLocaleUpperCase("tr");
const turSinif = t => t === "deneyim" ? "deneyim" : t === "kendin yap" ? "kendin" : "urun";
const turAd = t => t === "deneyim" ? "Deneyim" : t === "kendin yap" ? "Kendin yap" : "Ürün";

/* ---------- kayıtlı veriler ---------- */
let kisiler = oku("na-kisiler", []);
let favs = oku("na-favs", []).map(f => ({ ...f, etiket: f.etiket || [f.istek?.isim || f.istek?.kime, f.istek?.gun].filter(Boolean).join(" · ") }));
let gecmis = oku("na-gecmis", []);
let bilgiKapali = oku("na-bilgi", false);
let kullanici = oku("na-ad", "");
let tema = oku("na-tema", "");
function temaUygula() {
  if (tema) document.documentElement.dataset.theme = tema; else delete document.documentElement.dataset.theme;
  const koyu = tema === "dark" || (!tema && matchMedia("(prefers-color-scheme: dark)").matches);
  $("#themeColor").content = koyu ? "#000000" : "#FFFFFF";
}
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", temaUygula);
const kaydet = () => { yaz("na-kisiler", kisiler); yaz("na-favs", favs); yaz("na-gecmis", gecmis); };

/* ---------- tarih hesapları ---------- */
const bugun = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const gunFarki = d => Math.round((d - bugun()) / 864e5);
const pazar = (y, m, n) => { const d = new Date(y, m, 1); return new Date(y, m, 1 + (7 - d.getDay()) % 7 + 7 * (n - 1)); };
function sonraki(f) { const y = bugun().getFullYear(); let d = f(y); if (d < bugun()) d = f(y + 1); return d; }
const OZEL = [
  ["Yılbaşı", y => new Date(y, 0, 1), ""], ["Sevgililer Günü", y => new Date(y, 1, 14), "Sevgili"],
  ["Kadınlar Günü", y => new Date(y, 2, 8), ""], ["Anneler Günü", y => pazar(y, 4, 2), "Anne"],
  ["Babalar Günü", y => pazar(y, 5, 3), "Baba"], ["Öğretmenler Günü", y => new Date(y, 10, 24), "Öğretmen"]
];
function yaklasanlar() {
  const l = OZEL.map(([ad, f, kime]) => ({ ad, tarih: sonraki(f), gun: ad, kime }));
  for (const k of kisiler) {
    if (!k.dogum) continue;
    const [yy, mm, dd] = k.dogum.split("-").map(Number);
    const t = sonraki(y => new Date(y, mm - 1, dd));
    l.push({ ad: `${k.ad} doğum günü`, tarih: t, gun: "Doğum günü", kisiId: k.id, yas: yy > 1900 ? t.getFullYear() - yy : 0 });
  }
  return l.sort((a, b) => a.tarih - b.tarih).slice(0, 8);
}
const kalan = n => n === 0 ? "Bugün" : n === 1 ? "Yarın" : `${n} gün kaldı`;
const tarihYaz = d => d.toLocaleDateString("tr-TR", { day: "numeric", month: "long" });

/* ---------- sekmeler ---------- */
let sekme = "home";
const SEKMELER = [["home","home","Ana sayfa"],["bul","gift","Hediye bul"],["kisi","users","Kişilerim"],["kayit","heart","Kaydettiklerim"]];
function sekmeCiz() {
  $("#tabs").innerHTML = SEKMELER.map(([id, i, ad]) =>
    `<button data-act="sekme" data-v="${id}" class="${sekme === id ? "on" : ""}">${ic(i)}${ad}${id === "kayit" && favs.length ? `<span class="badge">${favs.length}</span>` : ""}</button>`).join("");
}
function git(s) {
  sekme = s;
  for (const [id] of SEKMELER) { const el = $("#v-" + id); el.hidden = id !== s; if (id === s) { el.classList.remove("scr"); void el.offsetWidth; el.classList.add("scr"); } }
  sekmeCiz(); ciz(); scrollTo(0, 0);
}
function ciz() { ({ home: anaCiz, bul: bulCiz, kisi: kisiCiz, kayit: kayitCiz })[sekme](); }

/* ---------- ana sayfa ---------- */
function selam() { const h = new Date().getHours(); return h < 6 ? "İyi geceler" : h < 12 ? "Günaydın" : h < 18 ? "İyi günler" : "İyi akşamlar"; }
function anaCiz() {
  const y = yaklasanlar();
  const hizli = kisiler.length ? kisiler.slice(0, 8).map(k => [k.ad, k.id]) : ["Anne","Baba","Sevgili","Arkadaş","Kardeş","Eş","Öğretmen","Kendim"].map(k => [k, ""]);
  $("#v-home").innerHTML = `
    <div class="top"><img src="/icon-192.png" alt="" style="width:40px;height:40px;border-radius:10px">
      <div class="hi"><small>${selam()}${kullanici ? "," : ""}</small><b>${kullanici ? esc(kullanici) : "Ne Alsam?"}</b></div>
      <button class="me" style="background:${kullanici ? renk(kullanici) : "var(--chip)"};color:${kullanici ? "#fff" : "var(--sub)"}" data-act="ayarlar" aria-label="Ayarlar">${kullanici ? esc(harf(kullanici)) : ic("gear")}</button></div>
    <h1 class="big">Bugün kimi mutlu ediyoruz?</h1>
    <form class="search" id="araForm" role="search">${ic("search")}<input id="araIn" maxlength="140" placeholder="ör. kahve seven 30 yaşında ablam" enterkeyhint="search"></form>
    <button class="cta" data-act="yeni">${ic("gift")}<div><b>Hediye bul</b><span>Birkaç soruya cevap ver, fikirler gelsin</span></div><svg class="ic go" viewBox="0 0 24 24">${YOL.arrow}</svg></button>
    ${!bilgiKapali && !(matchMedia("(display-mode: standalone)").matches || navigator.standalone) ? `<div class="note-row">${ic("phone")}<span>Ana ekrana ekle, uygulama gibi açılsın</span><button data-act="yukle">Nasıl?</button><button data-act="bilgiKapat" aria-label="Kapat">${ic("close")}</button></div>` : ""}
    <h2 class="sec">Koleksiyonlar</h2>
    <div class="hscroll">${KOLEKSIYON.map((c, i) => `<button class="coll" style="background:linear-gradient(135deg,${c.r[0]},${c.r[1]})" data-act="koleksiyon" data-i="${i}">${ic(c.ic)}<div><b>${c.ad}</b><small>${c.alt}</small></div></button>`).join("")}</div>
    <h2 class="sec">Yaklaşan günler <button data-act="sekme" data-v="kisi">Doğum günü ekle</button></h2>
    <div class="hscroll">${y.map((g, i) => { const n = gunFarki(g.tarih); return `<button class="day" data-act="gun" data-i="${i}"><div class="d">${tarihYaz(g.tarih)}</div><div class="n">${esc(g.ad)}</div><span class="k ${n <= 14 ? "hot" : ""}">${kalan(n)}</span></button>`; }).join("")}</div>
    <h2 class="sec">${kisiler.length ? "Kişilerin" : "Kime alıyorsun?"}</h2>
    <div class="grid4">${hizli.map(([ad, id]) => `<button class="tile" data-act="hizli" data-v="${esc(ad)}" data-id="${id}"><div class="av" style="background:${renk(ad)}">${esc(harf(ad))}</div>${esc(ad)}</button>`).join("")}${kisiler.length ? `<button class="tile" data-act="yeni"><div class="av" style="background:var(--chip);color:var(--sub)">${ic("plus")}</div>Başkası</button>` : ""}</div>
    <h2 class="sec">Bütçeye göre</h2>
    <div class="pills">${BUTCE.slice(0, 6).map(([v, l]) => `<button class="pill" data-act="butceIle" data-v="${v}">${l}</button>`).join("")}</div>
    ${gecmis.length ? `<h2 class="sec">Son aramaların <button data-act="gecmisSil">Temizle</button></h2>
    <div class="list">${gecmis.map((g, i) => `<button class="row" data-act="tekrar" data-i="${i}"><div class="av" style="background:${g.form?.serbest ? "var(--chip)" : renk(g.isim || g.kime)};color:${g.form?.serbest ? "var(--sub)" : "#fff"};width:34px;height:34px;font-size:14px">${g.form?.serbest ? ic("search") : esc(harf(g.isim || g.kime))}</div><div class="t"><b>${g.form?.serbest ? esc(etiketYap(g.form)) : esc(g.isim || g.kime) + (g.gun ? " · " + esc(g.gun) : "")}</b><small>${esc([BUTCE.find(b => b[0] === g.butce)?.[1], ...(g.ilgi || [])].filter(Boolean).join(", ") || "Ayrıntı yok")}</small></div>${ic("chev").replace('class="ic"', 'class="ic chev"')}</button>`).join("")}</div>` : ""}
    <p class="foot">Fiyatlar yaklaşıktır, almadan önce kontrol et.</p>`;
  $("#araForm").onsubmit = e => { e.preventDefault(); const q = $("#araIn").value.trim(); if (q.length < 3) { toast("Biraz daha anlat"); return; } serbestAra(q); };
}

/* ---------- hediye bulma (soru soru) ---------- */
const bosForm = () => ({ serbest: "", kime: "", kisiId: "", isim: "", yas: "", cinsiyet: "", gun: "", butce: null, ilgi: [], tarz: [], turler: [], acil: false, not: "" });
let w = Object.assign(bosForm(), oku("na-form", {}));
let adim = 0;          // 0-6 sorular, 7 sonuçlar
let sonuc = null;       // { istek, fikirler, filtre, sira, durum, hata }
const ADIMLAR = 7;
const formKaydet = () => yaz("na-form", w);

function yeniArama(on = {}) {
  w = Object.assign(bosForm(), on); adim = w.kime ? 1 : 0; sonuc = null; formKaydet(); git("bul");
}
function kisidenForm(k, ek = {}) {
  return { kime: k.kime || "Arkadaş", kisiId: k.id, isim: k.ad, yas: k.dogum ? String(bugun().getFullYear() - +k.dogum.slice(0, 4)) : "", cinsiyet: k.cinsiyet || "", ilgi: [...(k.ilgi || [])], not: k.not || "", ...ek };
}

function bulCiz() {
  if (adim >= ADIMLAR) return sonucCiz();
  const v = $("#v-bul");
  const atla = [1, 4, 5, 6].includes(adim);
  const ust = `<div class="wtop">${adim > 0 ? `<button class="iconbtn" data-act="geri" aria-label="Geri">${ic("back")}</button>` : `<button class="iconbtn" data-act="sekme" data-v="home" aria-label="Kapat">${ic("close")}</button>`}
    <div class="bar"><i style="width:${(adim + 1) / ADIMLAR * 100}%"></i></div>${atla && adim < 6 ? `<button class="skip" data-act="ileri">Atla</button>` : ""}</div>
    <div class="step">Adım ${adim + 1} / ${ADIMLAR}</div>`;
  let ic2 = "", dugme = "";
  if (adim === 0) {
    ic2 = `<h2 class="q">Hediye kime?</h2><p class="qs">Birini seç, gerisini birlikte netleştirelim.</p>
      ${kisiler.length ? `<div class="grp">Kişilerim</div><div class="hscroll" style="margin-bottom:6px">${kisiler.map(k => `<button class="tile" style="flex:none;width:84px" data-act="kisiSec" data-id="${k.id}"><div class="av" style="background:${renk(k.ad)}">${esc(harf(k.ad))}</div>${esc(k.ad)}</button>`).join("")}</div><div class="grp">Ya da</div>` : ""}
      <div class="opts">${KIME.map(k => secenek(k, w.kime === k, "kime")).join("")}</div>`;
  } else if (adim === 1) {
    ic2 = `<h2 class="q">${esc(w.kime === "Kendim" ? "Biraz kendinden bahset" : "Biraz ondan bahset")}</h2><p class="qs">İsteğe bağlı, ama fikirler daha isabetli olur.</p>

      <div class="grp">Türü</div><div class="pills">${TUR.map(([t, l]) => `<button class="pill sm ${w.turler.includes(t) ? "on" : ""}" data-act="tur" data-v="${t}">${l}</button>`).join("")}</div>

/* ---------- sunucuya istek ---------- */
// Yapay zekâ servisleri şimdilik Dolapta Ne Var projesinde çalışıyor (Gemini anahtarı orada).
// Bu projeye kendi GEMINI_API_KEY'i eklenirse API_ADRESI "" yapılabilir.
const API_ADRESI = location.hostname === "localhost" ? "" : "https://dolapta-ne-var-three.vercel.app";
async function api(yol, govde) {
  let r;
  try { r = await fetch(API_ADRESI + yol, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(govde) }); }
  catch { throw new Error("İnternet bağlantını kontrol et."); }
  let j = {}; try { j = await r.json(); } catch {}
  if (!r.ok) throw new Error(j.hata || "Şu an cevap alınamadı, birazdan tekrar dene.");
  return j;
}
function istekYap(f, haric) {
  const kisi = kisiler.find(k => k.id === f.kisiId);
  const ek = [
    f.tarz.length ? `Hediyenin tarzı: ${f.tarz.join(", ")}.` : "",
    f.acil ? "Çok acil: kargo beklemeden, bugün bir mağazadan bulunabilecek şeyler öner." : "",
    f.not.trim()
  ].filter(Boolean).join(" ").slice(0, 300);
  return { kime: f.kime, yas: f.yas, cinsiyet: f.cinsiyet, gun: f.gun, butce: f.butce || "", ilgi: f.ilgi, turler: f.turler, notlar: ek,
    haric: [...haric, ...(kisi?.alinan || []).map(a => a.ad)].slice(-30) };
}
async function ara(dahaFazla) {
  if (!dahaFazla) {
    sonuc = { istek: JSON.parse(JSON.stringify(w)), fikirler: [], filtre: "", sira: "", durum: "yukleniyor" };
    const iz = { kime: w.kime, isim: w.isim, gun: w.gun, butce: w.butce, ilgi: w.ilgi.slice(0, 4), form: sonuc.istek };
    gecmis = [iz, ...gecmis.filter(g => JSON.stringify(g.form) !== JSON.stringify(iz.form))].slice(0, 5); kaydet();
    adim = ADIMLAR;
  } else sonuc.durum = "dahayukleniyor";
  sonucCiz();
  const benim = sonuc;
  try {
    const j = await api("/api/hediye", istekYap(sonuc.istek, sonuc.fikirler.map(f => f.ad)));
    if (benim !== sonuc) return;
    const yeni = (j.fikirler || []).filter(f => !sonuc.fikirler.some(x => kucuk(x.ad) === kucuk(f.ad)));
    if (!yeni.length && !dahaFazla) throw new Error("Bu sefer fikir çıkmadı, bir daha dene.");
    sonuc.fikirler.push(...yeni); sonuc.durum = "tamam"; sonuc.hata = "";
  } catch (e) {
    if (benim !== sonuc) return;
    sonuc.durum = dahaFazla ? "tamam" : "hata"; sonuc.hata = e.message;
    if (dahaFazla) toast(e.message);
  }
  if (sekme === "bul") sonucCiz();
}

function serbestAra(q) {
  w = Object.assign(bosForm(), { kime: "Tarif edilen kişi", serbest: q.slice(0, 140), not: `Aradığım kişi ve durum: ${q.slice(0, 140)}` });
  formKaydet(); git("bul"); ara(false);
}

/* ---------- sonuçlar ---------- */
const fiyatSayi = s => { const m = String(s || "").replace(/\./g, "").match(/\d+/); return m ? +m[0] : Infinity; };
const favMi = f => favs.some(x => kucuk(x.ad) === kucuk(f.ad));
const etiketYap = i => i.serbest ? `"${i.serbest.length > 28 ? i.serbest.slice(0, 28) + "…" : i.serbest}"` : [i.isim || i.kime, i.gun].filter(Boolean).join(" · ");
function sonucCiz() {
  const s = sonuc, v = $("#v-bul");
  const ust = `<div class="rhead"><button class="iconbtn" ${s.istek.serbest ? 'data-act="sekme" data-v="home"' : 'data-act="adim" data-v="6"'} aria-label="Geri">${ic("back")}</button><div class="t">${s.istek.serbest ? "Sonuçlar" : esc(s.istek.isim || s.istek.kime) + " için"}</div><button class="iconbtn" data-act="listePaylas" aria-label="Paylaş">${ic("share")}</button></div>`;
  if (s.durum === "yukleniyor") { v.innerHTML = ust + `<p class="lead" style="margin:14px 2px">Fikirler hazırlanıyor…</p>` + '<div class="skel"></div>'.repeat(5); return; }
  if (s.durum === "hata") { v.innerHTML = ust + `<div class="msg"><b>Olmadı</b>${esc(s.hata)}<br><button class="btn" data-act="ara">${ic("refresh")}Tekrar dene</button></div>`; return; }
  let l = s.fikirler.map((f, i) => ({ f, i }));
  if (s.filtre) l = l.filter(x => x.f.tur === s.filtre);
  if (s.sira === "artan") l.sort((a, b) => fiyatSayi(a.f.fiyat) - fiyatSayi(b.f.fiyat));
  if (s.sira === "azalan") l.sort((a, b) => fiyatSayi(b.f.fiyat) - fiyatSayi(a.f.fiyat));
  const say = t => s.fikirler.filter(f => !t || f.tur === t).length;
  v.innerHTML = ust + `
    <div class="filt">${[["", "Tümü"], ...TUR].map(([t, a]) => `<button class="pill sm ${s.filtre === t ? "on" : ""}" data-act="filtre" data-v="${t}">${a} ${say(t)}</button>`).join("")}</div>
    ${s.istek.serbest ? `<p class="lead" style="margin-top:12px">"${esc(s.istek.serbest)}"</p>` : ""}<div class="sortline"><span>${l.length} fikir</span><select id="sira" aria-label="Sırala"><option value="">Önerilen</option><option value="artan" ${s.sira === "artan" ? "selected" : ""}>Ucuzdan pahalıya</option><option value="azalan" ${s.sira === "azalan" ? "selected" : ""}>Pahalıdan ucuza</option></select></div>
    ${l.map(({ f, i }) => urunKarti(f, i, "s")).join("") || `<div class="msg">Bu türde fikir yok.</div>`}
    ${s.durum === "dahayukleniyor" ? '<div class="skel"></div><div class="skel"></div>' : `<button class="btn ghost" data-act="daha" ${s.fikirler.length >= 30 ? "disabled" : ""}>${ic("refresh")}Daha fazla fikir</button>`}
    <button class="btn ghost" style="margin-top:8px" data-act="yeni">${ic("gift")}Yeni arama</button>`;
  $("#sira").onchange = e => { sonuc.sira = e.target.value; sonucCiz(); };
}
function urunKarti(f, i, k, alt) {
  const ts = turSinif(f.tur);
  return `<div class="item"><button style="display:flex;gap:13px;flex:1;text-align:left;min-width:0" data-act="detay" data-k="${k}" data-i="${i}">

const fikirAl = (k, i) => k === "s" ? sonuc?.fikirler[i] : favs[i];
function favDegis(f, etiket) {
  if (favMi(f)) { favs = favs.filter(x => kucuk(x.ad) !== kucuk(f.ad)); toast("Kaydedilenlerden çıkarıldı"); }
  else { favs.unshift({ ...f, etiket, kisiId: sonuc?.istek.kisiId || f.kisiId || "", kime: sonuc?.istek.kime || f.kime, isim: sonuc?.istek.isim || f.isim, gun: sonuc?.istek.gun || f.gun }); toast("Kaydedildi"); }

  if (k.dogum) { const [yy, mm, dd] = k.dogum.split("-").map(Number); const t = sonraki(y => new Date(y, mm - 1, dd)); dg = `${tarihYaz(t)} · ${kalan(gunFarki(t))}${yy > 1900 ? ` · ${t.getFullYear() - yy} yaşına giriyor` : ""}`; }
  sheetAc(`<div class="shead"><div class="av" style="background:${renk(k.ad)};width:48px;height:48px;font-size:19px">${esc(harf(k.ad))}</div><h3>${esc(k.ad)}<br><small style="font-size:14px;font-weight:500;color:var(--sub)">${esc(k.kime)}</small></h3><button class="iconbtn" data-act="kapat" aria-label="Kapat">${ic("close")}</button></div>
    ${dg ? `<div class="note-row" style="margin:0 0 14px">${ic("cal")}<span>${esc(dg)}</span></div>` : ""}
    ${k.ilgi?.length ? `<div class="grp" style="margin-top:0">Sevdikleri</div><div class="pills">${k.ilgi.map(i => `<span class="pill sm">${esc(i)}</span>`).join("")}</div>` : ""}
    ${k.not ? `<div class="grp">Not</div><p class="txt">${esc(k.not)}</p>` : ""}
    <div class="grp">Aldığın hediyeler</div>
    ${k.alinan?.length ? `<div class="list">${k.alinan.map((a, i) => `<div class="row"><div class="t"><b>${esc(a.ad)}</b><small>${esc(a.tarih)}</small></div><button data-act="alinanSil" data-id="${k.id}" data-i="${i}" aria-label="Sil" style="color:var(--sub)">${ic("trash")}</button></div>`).join("")}</div>` : `<p class="lead">Henüz yok. Bir fikirde "Bunu aldım"a basınca buraya eklenir ve bir daha önerilmez.</p>`}
    <button class="btn" style="margin-top:18px" data-act="kisiAra" data-id="${k.id}">${ic("gift")}${esc(k.ad)} için hediye bul</button>
    <div class="acts" style="margin-top:8px"><button data-act="kisiForm" data-id="${k.id}">${ic("pen")}Düzenle</button><button data-act="kisiSil" data-id="${k.id}">${ic("trash")}Sil</button></div>`);
}

/* ---------- kaydedilenler ---------- */
function kayitCiz() {
  const v = $("#v-kayit");
  if (!favs.length) { v.innerHTML = `<h1 class="big">Kaydettiklerim</h1><div class="empty">${ic("heart")}<b>Henüz bir şey yok</b>Beğendiğin fikirlerdeki kalbe dokun, burada saklansın.<br><button class="btn" data-act="yeni">${ic("gift")}Hediye bul</button></div>`; return; }
  const gruplar = {};
  favs.forEach((f, i) => (gruplar[f.etiket || "Diğer"] ||= []).push(i));
  v.innerHTML = `<h1 class="big">Kaydettiklerim</h1><p class="lead">${favs.length} fikir</p>` +
    Object.entries(gruplar).map(([g, l]) => `<h2 class="sec">${esc(g)}</h2>${l.map(i => urunKarti(favs[i], i, "f")).join("")}`).join("");
}

/* ---------- alttan açılan pencere ---------- */
function sheetAc(html) { $("#sbox").innerHTML = '<div class="grab"></div>' + html; $("#sheet").classList.add("on"); document.body.style.overflow = "hidden"; }
function sheetKapat() { $("#sheet").classList.remove("on"); document.body.style.overflow = ""; acik = null; kartNo++; }
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") sheetKapat(); });

async function paylas(metin) {
  if (navigator.share) { try { await navigator.share({ text: metin }); return; } catch (e) { if (e.name === "AbortError") return; } }
  try { await navigator.clipboard.writeText(metin); toast("Kopyalandı"); } catch { toast("Paylaşılamadı"); }
}

/* ---------- tüm dokunuşlar ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const { act, v, i, k, id, alan } = b.dataset;
  switch (act) {
    case "sekme": if (navigator.vibrate) try { navigator.vibrate(8); } catch {} sheetKapat(); if (v === "bul" && sekme === "bul" && adim >= ADIMLAR && sonuc) { sonucCiz(); break; } git(v); break;
    case "yeni": sheetKapat(); yeniArama(); break;
    case "bilgiKapat": bilgiKapali = true; yaz("na-bilgi", true); anaCiz(); break;
    case "yukle": yukle(); break;
    case "gun": { const g = yaklasanlar()[+i]; const kisi = kisiler.find(x => x.id === g.kisiId);
      yeniArama(kisi ? kisidenForm(kisi, { gun: g.gun, yas: g.yas ? String(g.yas) : "" }) : { gun: g.gun, kime: g.kime }); if (kisi || g.kime) { adim = 3; bulCiz(); } break; }
    case "hizli": { const kisi = kisiler.find(x => x.id === id); if (kisi) { yeniArama(kisidenForm(kisi)); adim = 2; bulCiz(); } else yeniArama({ kime: v }); break; }
    case "butceIle": yeniArama({ butce: v }); break;
    case "tekrar": { const g = gecmis[+i]; if (!g) break; w = Object.assign(bosForm(), g.form); formKaydet(); git("bul"); ara(false); break; }
    case "gecmisSil": gecmis = []; kaydet(); anaCiz(); break;
    case "geri": adim = Math.max(0, adim - 1); bulCiz(); scrollTo(0, 0); break;
    case "ileri": adim++; bulCiz(); scrollTo(0, 0); break;
    case "adim": adim = +v; bulCiz(); scrollTo(0, 0); break;
    case "sec": {
      const deger = alan === "butce" ? v : v;
      w[alan] = w[alan] === deger && alan !== "butce" ? "" : deger;
      if (alan === "kime") { w.kisiId = ""; w.isim = ""; }
      formKaydet(); bulCiz();
      if (w[alan] !== "" || alan === "butce") setTimeout(() => { adim++; bulCiz(); scrollTo(0, 0); }, 180);
      break; }
    case "kisiSec": { const kisi = kisiler.find(x => x.id === id); if (kisi) { w = Object.assign(bosForm(), kisidenForm(kisi)); formKaydet(); adim = 2; bulCiz(); scrollTo(0, 0); } break; }
    case "yas": { const n = Math.min(110, Math.max(0, (parseInt(w.yas) || (v > 0 ? 17 : 1)) + +v)); w.yas = String(n); formKaydet(); $("#fYas").value = n; break; }
    case "cins": w.cinsiyet = v; formKaydet(); b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); break;
    case "ilgi": w.ilgi = toggle(w.ilgi, v); formKaydet(); { const y = scrollY; bulCiz(); scrollTo(0, y); } break;
    case "ilgiEkle": ilgiEkle(); break;
    case "tarz": w.tarz = toggle(w.tarz, v); formKaydet(); b.classList.toggle("on"); break;
    case "tur": w.turler = toggle(w.turler, v); formKaydet(); b.classList.toggle("on"); break;
    case "acil": w.acil = !w.acil; formKaydet(); b.classList.toggle("on"); break;
    case "ara": if (!w.kime) { adim = 0; bulCiz(); toast("Önce kime alacağını seç"); break; } ara(false); scrollTo(0, 0); break;
    case "daha": ara(true); break;
    case "filtre": sonuc.filtre = v; sonucCiz(); break;
    case "listePaylas": if (sonuc?.fikirler.length) paylas(`${etiketYap(sonuc.istek)} için hediye fikirleri:\n\n` + sonuc.fikirler.map((f, n) => `${n + 1}. ${f.ad}${f.fiyat ? ` (${f.fiyat})` : ""}`).join("\n") + `\n\n${location.origin}`); break;
    case "detay": detayAc(k, +i); break;
    case "fav": { const f = fikirAl(k, +i); if (!f) break; favDegis(f, k === "s" ? etiketYap(sonuc.istek) : f.etiket); ciz(); break; }
    case "favD": { const f = fikirAl(acik.k, acik.i); if (!f) break; const a = { ...acik }; favDegis(f, a.k === "s" ? etiketYap(sonuc.istek) : f.etiket);
      if (a.k === "f" && !favMi(f)) { sheetKapat(); } else detayAc(a.k, a.k === "f" ? favs.findIndex(x => kucuk(x.ad) === kucuk(f.ad)) : a.i); ciz(); break; }
    case "kart": kartAc(); break;
    case "detayGeri": kartNo++; detayAc(acik.k, acik.i); break;
    case "ton": ton = v; b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); notYaz(); break;
    case "notYeni": notYaz(); break;
    case "notKopya": navigator.clipboard?.writeText($("#not").textContent).then(() => toast("Kopyalandı"), () => toast("Kopyalanamadı")); break;
    case "notPaylas": paylas($("#not").textContent); break;
    case "fikirPaylas": { const f = fikirAl(acik.k, acik.i); if (f) paylas(`${f.ad}${f.fiyat ? ` (${f.fiyat})` : ""}\n${f.neden || ""}\n\n${location.origin}`); break; }
    case "aldim": { const f = fikirAl(acik.k, acik.i); const kid = acik.k === "s" ? sonuc.istek.kisiId : f.kisiId; const kisi = kisiler.find(x => x.id === kid); if (!f || !kisi) break;
      kisi.alinan ||= [];
      if (kisi.alinan.some(a => kucuk(a.ad) === kucuk(f.ad))) kisi.alinan = kisi.alinan.filter(a => kucuk(a.ad) !== kucuk(f.ad));
      else { kisi.alinan.unshift({ ad: f.ad, tarih: new Date().toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: "numeric" }) }); toast(`${kisi.ad} için not edildi`); }
      kaydet(); detayAc(acik.k, acik.i); break; }
    case "benzer": { const f = fikirAl(acik.k, acik.i); if (!f) break; sheetKapat();
      const temel = acik?.k === "s" && sonuc ? sonuc.istek : { ...bosForm(), kime: f.kime || "Arkadaş", isim: f.isim || "", gun: f.gun || "" };
      w = Object.assign(bosForm(), JSON.parse(JSON.stringify(temel))); w.not = `"${f.ad}" gibi fikirler istiyorum, ama aynısı olmasın.`; formKaydet(); git("bul"); ara(false); break; }
    case "kapat": sheetKapat(); break;
    case "koleksiyon": { const c = KOLEKSIYON[+i]; yeniArama(JSON.parse(JSON.stringify(c.f))); break; }
    case "ayarlar": ayarlarAc(); break;
    case "tema": tema = v; yaz("na-tema", v); temaUygula(); b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); break;
    case "adKaydet": kullanici = $("#ayAd").value.trim().slice(0, 24); yaz("na-ad", kullanici); sheetKapat(); toast("Kaydedildi"); ciz(); break;
    case "hepsiniSil": if (confirm("Kişiler, kaydedilenler ve aramalar silinsin mi? Bu geri alınamaz.")) { ["na-kisiler","na-favs","na-gecmis","na-form","na-ad","na-tanitim"].forEach(x => { try { localStorage.removeItem(x); } catch {} }); location.reload(); } break;
    case "tanitIleri": tanitAdim(+v); break;
    case "tanitBitir": { const a = $("#tAd")?.value.trim(); if (a) { kullanici = a.slice(0, 24); yaz("na-ad", kullanici); } yaz("na-tanitim", true); const el = $("#tanit"); el.style.transition = "opacity .3s"; el.style.opacity = 0; setTimeout(() => el.remove(), 300); ciz(); break; }
    case "kisiForm": kisiFormAc(id); break;
    case "kCins": b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); break;
    case "kisiKaydet": {
      const ad = $("#kAd").value.trim(); if (!ad) { toast("Bir ad yaz"); $("#kAd").focus(); break; }
      const veri = { ad: ad.slice(0, 30), kime: $("#kKime").value, dogum: $("#kDogum").value, cinsiyet: $("#kCins .on")?.dataset.v || "",
        ilgi: $("#kIlgi").value.split(",").map(x => x.trim()).filter(Boolean).slice(0, 15), not: $("#kNot").value.trim() };
      const eski = kisiler.find(x => x.id === id);
      if (eski) Object.assign(eski, veri); else kisiler.push({ id: yeniId(), alinan: [], ...veri });
      kaydet(); sheetKapat(); toast("Kaydedildi"); ciz(); break; }
    case "kisiDetay": kisiDetayAc(id); break;
    case "kisiAra": { const kisi = kisiler.find(x => x.id === id); sheetKapat(); if (kisi) { yeniArama(kisidenForm(kisi)); adim = 2; bulCiz(); } break; }
    case "kisiSil": { const kisi = kisiler.find(x => x.id === id); if (kisi && confirm(`${kisi.ad} silinsin mi?`)) { kisiler = kisiler.filter(x => x.id !== id); kaydet(); sheetKapat(); ciz(); } break; }
    case "alinanSil": { const kisi = kisiler.find(x => x.id === id); if (kisi) { kisi.alinan.splice(+i, 1); kaydet(); kisiDetayAc(id); } break; }
  }
});

/* ---------- ayarlar ---------- */
function ayarlarAc() {
  sheetAc(`<div class="shead"><h3>Ayarlar</h3><button class="iconbtn" data-act="kapat" aria-label="Kapat">${ic("close")}</button></div>
    <label class="f" style="margin-top:0">Adın</label>
    <div class="addrow"><input class="in" id="ayAd" maxlength="24" placeholder="Sana nasıl seslenelim?" value="${esc(kullanici)}"><button data-act="adKaydet" aria-label="Kaydet">${ic("check")}</button></div>
    <label class="f">Görünüm</label>
    <div class="seg">${[["light","Beyaz"],["dark","Siyah"],["","Otomatik"]].map(([v, l]) => `<button data-act="tema" data-v="${v}" class="${tema === v ? "on" : ""}">${l}</button>`).join("")}</div>
    <p class="lead" style="font-size:13px;margin-top:8px">Otomatik: telefonun ayarına göre değişir.</p>
    <div class="list" style="margin-top:20px">
      <button class="row" data-act="yukle">${ic("phone")}<div class="t"><b>Ana ekrana ekle</b><small>Uygulama gibi açılsın</small></div>${ic("chev").replace('class="ic"', 'class="ic chev"')}</button>
      <button class="row" data-act="hepsiniSil" style="color:var(--acc)">${ic("trash")}<div class="t"><b>Tüm verileri sil</b><small style="color:var(--sub)">Kişiler, kaydedilenler, aramalar</small></div></button>
    </div>
    <p class="ver">Ne Alsam? · Sürüm 1.2<br>Verilerin sadece bu telefonda saklanır.</p>`);
}

/* ---------- ilk açılış: tanıtım ---------- */
const TANIT = [
  () => `<img src="/icon-512.png" alt=""><h2>Hediye bulmanın<br>en kolay yolu.</h2><p>Kime alacağını ve neleri sevdiğini söyle; ona gerçekten uyan fikirleri getirelim.</p>`,
  () => `<h2>Neler yapabilirsin?</h2>
    <div class="feat"><div class="fi" style="background:var(--acc-soft);color:var(--acc)">${ic("gift")}</div><div><b>Kişiye özel fikirler</b><span>Yaşı, bütçesi, sevdikleri ve tarzına göre</span></div></div>
    <div class="feat"><div class="fi" style="background:var(--blue-soft);color:var(--blue)">${ic("cal")}</div><div><b>Önemli günleri kaçırma</b><span>Doğum günleri ve özel günler ana sayfanda</span></div></div>
    <div class="feat"><div class="fi" style="background:var(--green-soft);color:var(--green)">${ic("pen")}</div><div><b>Kart notu da hazır</b><span>Duygusal, komik ya da şiirsel</span></div></div>`,
  () => `<h2>Sana nasıl<br>seslenelim?</h2><p>İstersen boş bırakabilirsin.</p><input class="in" id="tAd" maxlength="24" placeholder="Adın" style="margin-top:20px" value="${esc(kullanici)}">`
];
function tanitAdim(n) {
  const el = $("#tanit"); if (!el) return;
  el.innerHTML = `<div class="sl scr">${TANIT[n]()}</div><div class="bot"><div class="dots">${TANIT.map((_, i) => `<i class="${i === n ? "on" : ""}"></i>`).join("")}</div>
    <button class="btn" data-act="${n < TANIT.length - 1 ? "tanitIleri" : "tanitBitir"}" data-v="${n + 1}">${n < TANIT.length - 1 ? "Devam" : "Başla"}</button>
    ${n < TANIT.length - 1 ? `<button class="btn ghost" style="margin-top:8px;border:0;background:none;color:var(--sub)" data-act="tanitBitir">Geç</button>` : ""}</div>`;
  const i = $("#tAd"); if (i) i.onkeydown = e => { if (e.key === "Enter") $("[data-act=tanitBitir]").click(); };
}

/* ---------- telefona yükleme ---------- */
let istem = null;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); istem = e; });
async function yukle() {
  if (istem) { istem.prompt(); await istem.userChoice; istem = null; return; }
  sheetAc(`<div class="shead"><h3>Ana ekrana ekle</h3><button class="iconbtn" data-act="kapat" aria-label="Kapat">${ic("close")}</button></div>
    <div class="list"><div class="row"><b style="width:22px">1</b><div class="t"><b>Safari'de Paylaş düğmesine bas</b><small>Alttaki kare ve yukarı ok simgesi</small></div></div>
    <div class="row"><b style="width:22px">2</b><div class="t"><b>"Ana Ekrana Ekle"yi seç</b><small>Listeyi biraz aşağı kaydırman gerekebilir</small></div></div>
    <div class="row"><b style="width:22px">3</b><div class="t"><b>"Ekle"ye bas</b><small>Ne Alsam artık ana ekranında</small></div></div></div>`);
}
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));

temaUygula();
git("home");
if (!oku("na-tanitim", false)) { const d = document.createElement("div"); d.id = "tanit"; document.body.appendChild(d); tanitAdim(0); }
setTimeout(() => { const s = $("#splash"); s.classList.add("bitti"); setTimeout(() => s.remove(), 400); }, 1300);
</script>
</body>
</html>
